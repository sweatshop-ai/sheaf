# SPEC 18. A pull request, a push to main and the nightly run run on ubuntu only, and macOS runs only when someone
# starts the workflow by hand with `macos` ticked: a macOS minute counts ten times.
# tests/test_ci_workflow.py holds these triggers.
#
# To move the ubuntu image (24.04 to 26.04, or later ones), in one pull request of its own (#65):
#   1. Read the release notes of the newest Playwright for the systems it supports; take the first version
#      that names the new image. Playwright supports a fixed list of systems per version, and 1.58 refuses 26.04.
#   2. Set `playwright==` to that version in pyproject.toml's dev group and run `uv lock`.
#   3. Name the new image in the matrix below (and its comment), in MATRIX_OS in tests/test_ci_workflow.py and in SPEC 18.
#   4. Open the pull request. It runs on the new image, and since ci.yml and uv.lock are page paths, the page
#      tests run too: the bump changes the Chromium they drive. The Playwright cache key names the image and
#      uv.lock, so no browser of the old image is restored.
#   5. Start a manual run on the branch with python=all and macos ticked:
#      `gh workflow run ci.yml --ref <branch> -f python=all -f macos=true`.
#      The macOS job must fail on nothing that main's last manual macOS run passed (main's run 44776626154 was
#      red on every Python, see the matrix); once it is green, it must stay green.
#   6. Merge only when both runs are green, page tests included. 24.04 stays supported by GitHub for years and
#      its retirement is announced with brownouts, so there is no hurry to move before Playwright is ready.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    # Notes no test reads: on 2026-11-15 70 of main's 85 commits touched nothing else, and each push ran
    # the whole suite. A push that changes anything outside them still runs it all.
    paths-ignore: ['.scratch/**', '.boss/**']
  # paths-ignore filters push and pull_request only; a scheduled run always starts.
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      macos:
        description: Add the macOS jobs (a macOS minute counts ten times)
        type: boolean
        default: false
      python:
        description: Python version to test (all is every version of the matrix)
        type: choice
        options: [all, "3.11", "3.13", "3.14"]
        default: all

# A new push to a pull request cancels its earlier run. A run on main is never cancelled once it has
# started. Every push to main shares one group, `ci-main`: a group holds one running and one waiting run,
# and a newer waiting run replaces an older one even with cancel-in-progress false. A burst of merges
# therefore leaves the run that started and the newest one, and the newest covers every merge it
# replaced. This replaces a group per run (`ci-<run_id>`), which queued one full run of six jobs per
# merge: the organisation's plan allows 20 concurrent hosted jobs, nine queued merges held 54, and every
# pull request run waited behind them for 30 to 50 minutes. The cost: a regression is pinned to a range
# of merges, not to one, and `git bisect` or a manual run on a merge finds it. The nightly and manual
# runs keep a group of their own, so a merge never replaces the run on all Pythons.
concurrency:
  group: ci-${{ github.event_name == 'push' && 'main' || github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} py${{ matrix.python }}${{ matrix.slice != '' && format(' slice {0}', matrix.slice) || '' }}
    # An ubuntu job of this repository (a push, the nightly run, a manual run, a pull request whose head is a branch of
    # this repository) runs on the organisation's own runners: the whole suite in one job, 16 workers. A pull
    # request from a fork or opened by Dependabot (its branch is in this repository and skips the approval of a fork's
    # workflows, but it runs the code of an updated dependency), and macOS always, run on GitHub's. The label of the runner is chosen by the workflow file the
    # run reads, and a fork's pull request reads the fork's: so the repository setting that holds a fork's workflows until
    # someone has read them (all external contributors) is what keeps a fork off those runners, not this line (SPEC 18).
    runs-on: ${{ matrix.os == 'ubuntu-24.04' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) && fromJSON('["self-hosted","linux","sheaf-ci"]') || matrix.os }}
    # An ubuntu run takes about 25 minutes; 45 still stops a hang. A macOS runner (3 cores, an M1 VM) runs the
    # same suite about four times slower: a process start costs 50 ms there and pandoc's 210 ms, against 1 and
    # 4 ms on ubuntu (run 40997993309), and the tests start thousands. Its non-page tests alone take about
    # 45 minutes, so macOS gets 120; stall_watch still ends a hang 10 quiet minutes after it starts.
    timeout-minutes: ${{ startsWith(matrix.os, 'ubuntu') && 60 || 120 }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04, never ubuntu-latest: that label moved to 26.04 on 2026-10-29 and Playwright 1.58 refused
        # it, so the page tests broke with no change of ours. The image moves only in a pull request.
        # macos-26, never macos-latest, for the same reason: it is the image macos-latest ran on 2026-10-30
        # (macos-26-arm64, run 40980723217). macOS has been green once, on a branch (run 41025108862, py3.13),
        # and red on main (run 44776626154, every Python); the pin keeps the image from moving under that work.
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.macos && '["ubuntu-24.04","macos-26"]' || '["ubuntu-24.04"]') }}
        python: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.python != 'all' && format('["{0}"]', inputs.python) || (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && '["3.11","3.13","3.14"]' || '["3.13"]') }}
        # On the organisation's runners each Python is one job with the whole suite (the value is empty, so SHEAF_TEST_SLICE is empty).
        # On GitHub's runners, a pull request from a fork and a manual run with macOS, it is six jobs, each with a sixth
        # of the tests (SHEAF_TEST_SLICE, tests/conftest.py): the page tests wait on the browser one at a time and were
        # most of a run, and on 4 xdist workers in one hosted runner a different page test or two failed on every run,
        # so there they are split across jobs.
        slice: ${{ fromJSON(((github.event_name == 'pull_request' && !(github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) || (github.event_name == 'workflow_dispatch' && inputs.macos)) && '["1/6","2/6","3/6","4/6","5/6","6/6"]' || '[""]') }}
    env:
      SHEAF_TEST_SLICE: ${{ matrix.slice }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A pull request's checkout is its merge commit; two commits give the base as its first parent.
          fetch-depth: 2
          # The workspace of a self-hosted runner outlives the job: no token is left in its git config.
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install from the lock
        run: uv sync --locked

      # -v names every test in the log, and tools/ci/stall_watch.py dumps
      # the process table and the pytest process's thread stacks when the output stops for six
      # minutes, then ends the run after ten, so a hung job names itself instead of being cancelled.
      - name: Tests
        # The names no file of this public repository may hold (tests/public_tree.py): a secret, because even a
        # hash of them would publish them. Only this step has it. A run without it fails, and a pull request
        # from a fork has none.
        env:
          SHEAF_PUBLIC_TREE_TERMS: ${{ secrets.SHEAF_PUBLIC_TREE_TERMS }}
        # The organisation's machine has 32 cores for three runners: 16 workers cut a full run there from 137 s to 98 s, and 32 is no faster
        # alone and slower with three runs at once (measured on another suite, 2026-11-16). GitHub's runner has 4 cores.
        # `loadgroup`, not `worksteal`: only `loadgroup` keeps a file with IN_ORDER = True on one worker (tests/conftest.py).
        run: uv run --no-sync python tools/ci/stall_watch.py -- uv run --no-sync pytest -v ${{ runner.environment == 'self-hosted' && '-n 16 --dist loadgroup' || '-n 4' }} --durations=25 -m "not page"

      # The page tests drive Chromium through Playwright (tests/page) and take about half of a pull
      # request's run. A pull request that changes no path they load skips them, and says so here
      # (tools/ci/page_paths.py holds the list). A push to main, the nightly run and a manual run
      # always run them. Until tests/page exists on main there is nothing to run.
      - name: Decide whether the page tests run
        id: page
        run: uv run --no-sync python tools/ci/page_paths.py

      # The cache key names the runner image, so a move of the image does not restore browsers built on the
      # old one. ImageOS is set on GitHub's runners but is not in the env context of an expression. A self-hosted runner has no image
      # to name and keeps its browsers in the home of its runner user from one job to the next: no cache there.
      - name: Name the runner image
        id: image
        if: hashFiles('tests/page/**') != '' && steps.page.outputs.run == 'true' && runner.environment == 'github-hosted'
        shell: bash
        run: echo "os=${ImageOS:?ImageOS is not set on this runner}" >> "$GITHUB_OUTPUT"

      # The page tests that run in Firefox or WebKit are all in the last slice (tests/conftest.py), and `--with-deps` puts
      # apt on those engines' system packages (126 MB, 181 packages in run 44788361173, against about 20 MB for Chromium's).
      # A slice installs the engines of the tests it collected, so none keeps a list of its own, and Chromium always.
      - name: Name the browsers this slice runs
        id: engines
        if: hashFiles('tests/page/**') != '' && steps.page.outputs.run == 'true'
        shell: bash
        run: |
          collected=$(uv run --no-sync pytest -m page --collect-only -q) || { echo "$collected" | tail -30; echo "::error::the page tests did not collect"; exit 1; }
          # The engine is the first part of the id: a Chromium id can hold "-webkit-user-modify" in a later one.
          engines=chromium
          for e in firefox webkit; do
            if grep -Eq "::.*\[$e(-|])" <<<"$collected"; then engines="$engines $e"; fi
          done
          echo "engines=$engines" >> "$GITHUB_OUTPUT"
          echo "set=${engines// /-}" >> "$GITHUB_OUTPUT"

      - name: Cache the Playwright browsers
        if: hashFiles('tests/page/**') != '' && steps.page.outputs.run == 'true' && runner.environment == 'github-hosted'
        uses: actions/cache@v4
        with:
          path: ${{ runner.os == 'macOS' && '~/Library/Caches/ms-playwright' || '~/.cache/ms-playwright' }}
          key: playwright-${{ runner.os }}-${{ steps.image.outputs.os }}-${{ steps.engines.outputs.set }}-${{ hashFiles('uv.lock') }}

      - name: Page tests (Playwright)
        if: hashFiles('tests/page/**') != '' && steps.page.outputs.run == 'true'
        # The page tests take 4 to 8 minutes; the install is bounded below. A step that runs past 40 is stuck.
        timeout-minutes: 40
        # A page test that stalls (PageStalled, or a timeout in the Playwright driver) leaves its evidence here:
        # tests/page/stall_evidence.py, ticket 173 O. Set, it also gives the session's Chromium a DevTools port on the loopback,
        # open to any process of the machine for the step: that browser holds only the test hubs' throwaway pages and
        # cookies, and a self-hosted machine here runs only this repository's jobs (runner group, SPEC 18).
        env:
          SHEAF_STALL_EVIDENCE: ${{ runner.temp }}/stall-evidence
        shell: bash
        run: |
          set -o pipefail
          # --with-deps installs the browsers' system packages through sudo, which GitHub's runners have.
          # Firefox and WebKit are here, and only in the slice that holds their tests, for the mount tests (#116: the
          # rectoverso mounts in a shadow root and its selection code must hold in all three engines); the other steps
          # install no browser.
          engines="${{ steps.engines.outputs.engines }}"
          deps=""
          # Only on a GitHub-hosted runner: the other is a shared machine whose packages are not this job's to install.
          if [ "$RUNNER_OS" = "Linux" ] && [ "$RUNNER_ENVIRONMENT" = "github-hosted" ] && command -v sudo >/dev/null; then deps="--with-deps"; fi
          # apt's mirror is sometimes slow (45 minutes for 125 MB, run 44765451025): each try is cut at 10 minutes and the next
          # one goes on from the packages apt already holds. macOS has no `timeout` and no apt, so it installs unbounded.
          bounded=""
          if command -v timeout >/dev/null; then bounded="timeout -k 30 600"; fi
          # `timeout` ends playwright, not the apt-get it started under sudo (root's, so no signal of ours reaches it): that one
          # goes on, holds the dpkg lock and a next try fails on it in two seconds (exit 100; runs 44789430505, 44790768975).
          # So after a try, root ends the apt-get; a dpkg it had started finishes its package, and `dpkg --configure -a`
          # settles a half-done one. The wait of 60 s at most is a safety net, not the plan.
          stop_apt() {
            sudo pkill -TERM -x apt-get || true; sleep 3; sudo pkill -KILL -x apt-get || true
            timeout 60 bash -c 'while pgrep -x apt-get >/dev/null || pgrep -x dpkg >/dev/null; do sleep 2; done' || true
            sudo dpkg --configure -a || true
          }
          for try in 1 2 3; do $bounded uv run --no-sync playwright install $deps $engines && break; if [ "$try" = 3 ]; then echo "::error::the browsers did not install in three tries"; exit 1; fi; if [ -n "$deps" ]; then stop_apt; fi; done
          uv run --no-sync python tools/ci/stall_watch.py -- uv run --no-sync pytest -v --durations=25 -m page -rs 2>&1 | tee page-tests.txt
          # A page test that cannot start its browser skips with a reason. Here that is a failure.
          if grep -Eq '[0-9]+ skipped' page-tests.txt; then
            echo "::error::page tests were skipped, so a browser (Chromium, Firefox or WebKit) did not start"
            exit 1
          fi

      # The page journal, the hub's side, every stack and the process table of each page test that stalled: read
      # through Chromium's own DevTools port, so they are there even when the driver froze, as on macOS (ticket 173 O).
      - name: Keep the evidence of a stalled page test
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stall-evidence-${{ runner.os }}-py${{ matrix.python }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/stall-evidence
          if-no-files-found: ignore
          retention-days: 14

      # A Chromium has closed with no word on a runner. The runner is a container
      # with no dmesg (kernel.dmesg_restrict) and a memory cap of its own, so this reads what it can: the cgroup's
      # own count of OOM kills, the memory and load, and /dev/shm. Nothing here changes the result of the job.
      - name: Host state after a failure
        if: failure() && runner.os == 'Linux'
        shell: bash
        run: |
          free -m || true
          uptime || true
          cat /sys/fs/cgroup/memory.max /sys/fs/cgroup/memory.current /sys/fs/cgroup/memory.events 2>/dev/null || true
          df -h /dev/shm || true
          dmesg 2>/dev/null | tail -50 || true
          journalctl -k --no-pager -n 50 2>/dev/null || true

      - name: Wheel smoke (build, uv tool install, sheaf version, --share, init cursor, a hub)
        run: uv run --no-sync python tools/wheel_smoke.py

      # These two install a real user service on the runner. They refuse to run anywhere else. The service
      # is the same in every slice, so the first slice alone checks it (about 70 s a job). Never on those runners: it is a
      # machine of the organisation's with other people's sessions on it, not a container thrown away after the job.
      - name: User service, systemd
        if: runner.os == 'Linux' && runner.environment == 'github-hosted' && (matrix.slice == '' || startsWith(matrix.slice, '1/'))
        run: PATH="$PWD/.venv/bin:$PATH" .venv/bin/python tools/ci/service_linux.py

      - name: User service, launchd
        if: runner.os == 'macOS' && (matrix.slice == '' || startsWith(matrix.slice, '1/'))
        run: PATH="$PWD/.venv/bin:$PATH" .venv/bin/python tools/ci/service_macos.py
